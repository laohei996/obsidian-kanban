name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Locate Yarn cache
        id: yarn-cache
        run: printf 'dir=%s\n' "$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: kanban-yarn-${{ runner.os }}-${{ runner.arch }}-node24-yarn1.22.22-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Typecheck
        run: yarn typecheck
      - name: Lint all source files
        run: yarn lint
      - name: Validate translations
        run: yarn i18n:check

  regression:
    name: Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Locate Yarn cache
        id: yarn-cache
        run: printf 'dir=%s\n' "$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: kanban-yarn-${{ runner.os }}-${{ runner.arch }}-node24-yarn1.22.22-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test real product behavior
        run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.x'
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Locate Yarn cache
        id: yarn-cache
        run: printf 'dir=%s\n' "$(yarn cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: kanban-yarn-${{ runner.os }}-${{ runner.arch }}-node24-yarn1.22.22-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build plugin
        run: yarn build
      - name: Validate and package test build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/package-ci.mjs "$RUNNER_TEMP/kanban-ci-package"
      - name: Upload unreleased test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanban-test-${{ github.event.pull_request.number || 'main' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kanban-ci-package/kanban-plugin.zip
            ${{ runner.temp }}/kanban-ci-package/build-info.json
            ${{ runner.temp }}/kanban-ci-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI / Required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [quality, regression, build]
    if: ${{ always() }}
    steps:
      - name: Require every check to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          REGRESSION: ${{ needs.regression.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          printf 'Quality=%s Regression=%s Build=%s\n' "$QUALITY" "$REGRESSION" "$BUILD"
          [[ "$QUALITY" == success && "$REGRESSION" == success && "$BUILD" == success ]]
